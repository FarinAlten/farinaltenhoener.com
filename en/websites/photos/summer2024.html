                    onclick="openLightbox('https://lh3.googleusercontent.com/pw/AP1GczPU28T9IY3bgFxQVx3HTkkvMnKkXdz7uI_DMjS50rvtezk9tip7MrQ7soPkGCbiHn7CRY2AN9uVxR3rl4y-Mm0xKgju2Gq4ffK6cagFjDFHdt22Ks-M=w2400')"

    <div id="lightbox" class="lightbox" onclick="closeLightbox(event)">
        <span class="lightbox-close" onclick="closeLightbox(event)">&times;</span>
        <img id="lightbox-img" src="" alt="Enlarged photo">
        <a id="lightbox-download" class="lightbox-download-btn" download target="_blank">
            Download Photo
        </a>
    </div>

    <script>
        function openLightbox(highResSrc) {
            const lightbox = document.getElementById('lightbox');
            const lightboxImg = document.getElementById('lightbox-img');
            const lightboxDownload = document.getElementById('lightbox-download');

            lightboxImg.src = highResSrc;
            lightboxDownload.href = highResSrc;
            lightbox.classList.add('active');
        }

        function closeLightbox(event) {
            if (event.target.id !== 'lightbox-img' && event.target.id !== 'lightbox-download') {
                document.getElementById('lightbox').classList.remove('active');
            }
        }
    </script>
